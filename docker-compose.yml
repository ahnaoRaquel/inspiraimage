services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inspiraimage
    ports:
      - '5432:5432'
    volumes:
      - ./data:/var/lib/postgresql/18/data
    networks:
      - inspiraimage-network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
    ports:
      - '15432:80'
    depends_on:
      - db
    networks:
      - inspiraimage-network

  sbootapp:
    build:
      dockerfile: Dockerfile
      context: ./inspiraimageapi
    container_name: inspiraimageapi
    restart: on-failure
    depends_on:
      - db
    ports:
        - '8080:8080'
    networks:
      - inspiraimage-network
    environment:
      - "POSTGRES_HOST=db"

  app:
    build:
      dockerfile: Dockerfile
      context: ./inspiraimageui
    container_name: inspiraimageui
    restart: on-failure
    depends_on:
      - sbootapp
    ports:
      - '3000:3000'
    networks:
      - inspiraimage-network
    expose:
      - 3000

networks:
  inspiraimage-network:
    driver: bridge

