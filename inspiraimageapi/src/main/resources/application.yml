spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/inspiraimage
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/inspiraimage