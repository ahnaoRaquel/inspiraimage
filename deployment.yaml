apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: db
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inspiraimage
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - mountPath: /var/lib/postgresql/18/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: db
      port: 5432
      targetPort: db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspiraimageapi
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inspiraimageapi
  template:
    metadata:
      labels:
        app: inspiraimageapi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: inspiraimageapi
          image: inspiraimage-sbootapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: inspiraimageapi-service
spec:
  type: NodePort
  selector:
    app: inspiraimageapi
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspiraimageui
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inspiraimageui
  template:
    metadata:
      labels:
        app: inspiraimageui
    spec:
      containers:
        - name: inspiraimageui
          image: inspiraimage-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://inspiraimageapi-service:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: inspiraimageui-service
spec:
  type: NodePort
  selector:
    app: inspiraimageui
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30000